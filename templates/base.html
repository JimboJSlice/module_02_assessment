<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="{{ url_for('static', filename='style.css') }}"
      rel="stylesheet"
    />
    {% block title %}{% endblock %}
  </head>
  <body>
    <a class="navbar-brand fw-bold fs-4" href="{{ url_for('home') }}">Logo</a>
    <nav class="navbar navbar-expand-lg navbar-light bg-yellow border-bottom">
        <div class="container">
        <ul class="navbar-nav mx-auto mb-2">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('trips') }}">My Trips</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
        </ul>
        </nav>
    </div>
    <main>{% block content %} {% endblock %}</main>
    <footer class="border-top bg-white mt-5">
        <div class="container py-4">
          <div class="text-center text-muted small">
            &copy; 2026 All rights reserved.
          </div>
        </div>
    </footer>
  </body>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
