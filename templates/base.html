<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="{{ url_for('static', filename='style.css') }}"
      rel="stylesheet"
    />
    {% block title %}{% endblock %}
  </head>
  <body>
 <!-- Navigation -->
    <nav
        class="navbar navbar-expand-lg bg-white border-bottom"
        aria-label="Main navigation"
    >

        <div class="container">

            <!-- Logo -->
            <a
                class="navbar-brand"
                href="{{ url_for('home') }}"
                aria-label="Roamly home"
            >

                <img
                    src="{{ url_for('static', filename='images/roamly-logo.png') }}"
                    alt="Roamly"
                    class="roamly-logo"
                >

            </a>


            <!-- Mobile menu button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Open navigation menu"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation links -->
            <div
                class="collapse navbar-collapse"
                id="mainNavbar"
            >

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                            href="{{ url_for('home') }}"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'all_trips' %}active{% endif %}"
                            href="{{ url_for('all_trips') }}"
                        >
                            My Trips
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'about' %}active{% endif %}"
                            href="{{ url_for('about') }}"
                        >
                            About
                        </a>
                    </li>

                </ul>


                <!-- User menu -->
                <div class="dropdown mt-3 mt-lg-0">

                    <button
                        class="btn user-button dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        Yoni
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <a
                                class="dropdown-item"
                                href="{{ url_for('home') }}"
                            >
                                Dashboard
                            </a>
                        </li>

                        <li>
                            <a
                                class="dropdown-item"
                                href="{{ url_for('create_trip') }}"
                            >
                                Create Trip
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </nav>


    <!-- Main content -->
    <main id="main-content">

        {% block content %}{% endblock %}

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <div class="row gy-3 align-items-center">

                <div class="col-md-6">

                    <p class="mb-0">
                        <strong>Roamly</strong>
                        — Plan. Explore. Remember.
                    </p>

                </div>

                <div class="col-md-6 text-md-end">

                    <p class="mb-0">
                        &copy; 2026 Roamly
                    </p>

                </div>

            </div>

        </div>

    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
